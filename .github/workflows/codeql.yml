# CodeQL: static analysis of the C# code for security problems (docs/RELEASING.md).
# build-mode none reads the source without compiling it, so it runs on a (fast) Linux runner in a
# few minutes. The weekly run on main is the baseline pull requests are compared with.
name: CodeQL

on:
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # Mondays
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    # Code scanning needs a public repository (or GitHub Advanced Security): skipped while the repo is private.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read # the action reads its own workflow run (fails with "Resource not accessible by integration" without it)
      security-events: write # upload the results
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: github/codeql-action/init@v3
        with:
          languages: csharp
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@v3
