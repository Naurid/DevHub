# Build, tests and security checks (docs/RELEASING.md): on pull requests, inside every release
# (release.yml calls this before it publishes, so a push to main runs it once, not twice), and on
# demand for any branch (Actions → CI → Run workflow).
# Windows: the tests run real cmd / git / dotnet commands.
name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages # cached below, so restore takes seconds

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: NuGet cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore DevHub.sln

      - name: Build (warnings are errors)
        run: dotnet build DevHub.sln --no-restore -c Release -warnaserror

      - name: Test
        run: dotnet test DevHub.sln --no-build -c Release --logger trx --results-directory test-results

      - name: Translations (every text has its French)
        run: dotnet run --project tools/I18n -c Release -- check src

      - name: Test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results

      - name: Vulnerable packages
        shell: pwsh
        run: |
          $report = dotnet list DevHub.sln package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Output $report
          if ($report -match "has the following vulnerable packages") { throw "Vulnerable NuGet packages (see above)." }

      - name: SBOM (CycloneDX)
        shell: pwsh
        run: |
          dotnet tool install --global CycloneDX
          dotnet-CycloneDX DevHub.sln --output sbom --filename devhub-sbom.json --json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom

  dependency-review:
    # Needs a public repository (or GitHub Advanced Security): skipped while the repo is private.
    if: github.event_name == 'pull_request' && !github.event.repository.private
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
